# Quality gates for every push to every branch, including main. Checks attach to the commit,
# so pull requests show them too, and a red check blocks the merge once branch protection
# requires it (repo Settings → Branches).
name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public identifiers (they ship in the site's JavaScript anyway). The token is a secret.
  NEXT_PUBLIC_SANITY_PROJECT_ID: 41uvtiqz
  NEXT_PUBLIC_SANITY_DATASET: production
  SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
  # Build as if production, so robots, canonical links and indexing are tested as shipped.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm test

  browser:
    name: Browser tests (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --workspace=frontend
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse (95+ in every category)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=frontend
      - run: npm run lighthouse --workspace=frontend
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/reports
          retention-days: 30
